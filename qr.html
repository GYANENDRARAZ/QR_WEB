<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vehicle QR Generator</title>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
            color:white;
        }

        .container{
            width:100%;
            max-width:1200px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:30px;
        }

        .card{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            border-radius:25px;
            padding:35px;
            border:1px solid rgba(255,255,255,0.1);
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }

        h1{
            font-size:40px;
            margin-bottom:10px;
        }

        .subtitle{
            color:#cbd5e1;
            margin-bottom:30px;
        }

        .input-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            outline:none;
            border-radius:15px;
            background:#1e293b;
            color:white;
            border:1px solid #334155;
            font-size:16px;
        }

        input:focus{
            border:1px solid #06b6d4;
        }

        button{
            width:100%;
            padding:16px;
            border:none;
            border-radius:15px;
            background:#06b6d4;
            color:black;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#22d3ee;
        }

        .qr-section{
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
        }

        #qrcode{
            background:white;
            padding:20px;
            border-radius:20px;
            margin-top:20px;
        }

        .download-btn{
            margin-top:25px;
            background:#22c55e;
        }

        .download-btn:hover{
            background:#4ade80;
        }

        .vehicle-details{
            margin-top:20px;
            line-height:1.8;
        }

        @media(max-width:900px){
            .container{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Left Side -->
        <div class="card">
            <h1>Vehicle QR Generator</h1>
            <p class="subtitle">
                Generate and download vehicle QR codes instantly.
            </p>

            <div class="input-group">
                <label>Owner Name</label>
                <input type="text" id="owner" placeholder="Enter owner name">
            </div>

            <div class="input-group">
                <label>Vehicle Type</label>
                <input type="text" id="vehicleType" placeholder="Car / Bike">
            </div>

            <div class="input-group">
                <label>Vehicle Number</label>
                <input type="text" id="vehicleNumber" placeholder="KA01AB1234">
            </div>

            <div class="input-group">
                <label>Vehicle Model</label>
                <input type="text" id="vehicleModel" placeholder="Hyundai Creta">
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="9876543210">
            </div>

            <button onclick="generateQR()">
                Generate QR Code
            </button>
        </div>

        <!-- Right Side -->
        <div class="card qr-section">

            <h1>Generated QR</h1>

            <div id="qrcode"></div>

            <div class="vehicle-details" id="details"></div>

            <button class="download-btn" onclick="downloadQR()">
                Download PNG
            </button>

        </div>

    </div>

    <script>

        let qr;

        function generateQR(){

            const owner = document.getElementById("owner").value;
            const vehicleType = document.getElementById("vehicleType").value;
            const vehicleNumber = document.getElementById("vehicleNumber").value;
            const vehicleModel = document.getElementById("vehicleModel").value;
            const phone = document.getElementById("phone").value;

            const qrData =
`Owner Name: ${owner}
Vehicle Type: ${vehicleType}
Vehicle Number: ${vehicleNumber}
Vehicle Model: ${vehicleModel}
Phone Number: ${phone}`;

            document.getElementById("qrcode").innerHTML = "";

            qr = new QRCode(document.getElementById("qrcode"), {
                text: qrData,
                width: 300,
                height: 300
            });

            document.getElementById("details").innerHTML = `
                <p><b>Owner:</b> ${owner}</p>
                <p><b>Vehicle:</b> ${vehicleType}</p>
                <p><b>Number:</b> ${vehicleNumber}</p>
            `;
        }

        function downloadQR(){

            const img = document.querySelector("#qrcode img");

            if(!img){
                alert("Please generate QR first");
                return;
            }

            const link = document.createElement("a");

            link.href = img.src;

            const vehicleNumber =
                document.getElementById("vehicleNumber").value || "vehicle_qr";

            link.download = vehicleNumber + ".png";

            link.click();
        }

    </script>

</body>
</html>
